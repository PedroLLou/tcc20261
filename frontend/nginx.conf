worker_processes auto;
pid /tmp/nginx.pid;
# Erros NGINX podem conter URL, Host e endereço do cliente sem filtro.
# O access log abaixo registra status e duração sem esses dados.
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $request_method $safe_method {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    map $uri $safe_route {
        default spa;
        ~^/api/ api;
        ~^/static/ static;
    }
    log_format safe_json escape=json
        '{"service":"frontend","method":"$safe_method","route":"$safe_route",'
        '"status":$status,"duration_s":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout safe_json;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /tmp/default.conf;
}
