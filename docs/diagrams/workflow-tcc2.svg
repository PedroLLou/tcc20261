<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" role="img" aria-labelledby="title desc"><title id="title">Fluxo proposto de desenvolvimento do TCC2</title><desc id="desc">Versão sintética do fluxo Mermaid: tarefa, branch, verificações, revisão humana, ajustes, integração e conclusão.</desc><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7z" fill="#333"/></marker><style>text{font-family:Arial,sans-serif;font-size:16px;fill:#222}.box{stroke-width:2}.arrow{fill:none;stroke:#333;stroke-width:2;marker-end:url(#a)}.label{font-size:14px;font-weight:bold}.tag{fill:#fff}</style></defs><rect width="1600" height="670" fill="white"/><text x="40" y="45" font-size="24" font-weight="bold">Workflow de desenvolvimento — proposta para o TCC2</text><rect class="box" x="35" y="260" width="175" height="70" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="61" y="290">Selecionar tarefa</text><text x="75" y="312">priorizada</text><polygon class="box" points="320,245 425,295 320,345 215,295" fill="#fff2cc" stroke="#d6b656"/><text x="263" y="285">Objetivo, aceite,</text><text x="263" y="305">responsável e</text><text x="263" y="325">dependências claros?</text><rect class="box" x="455" y="260" width="200" height="70" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="482" y="288">Em andamento:</text><text x="470" y="310">branch, implementação</text><text x="500" y="328">e verificação</text><polygon class="box" points="770,245 875,295 770,345 665,295" fill="#fff2cc" stroke="#d6b656"/><text x="708" y="285">Verificações no</text><text x="713" y="305">SHA atual passaram?</text><rect class="box" x="910" y="260" width="200" height="70" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text x="949" y="288">Em revisão:</text><text x="927" y="310">PR e revisão humana</text><polygon class="box" points="1205,245 1295,295 1205,345 1115,295" fill="#fff2cc" stroke="#d6b656"/><text x="1160" y="290">Há ajustes</text><text x="1158" y="310">solicitados?</text><rect class="box" x="1370" y="260" width="190" height="70" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="1409" y="288">Conferir aceite,</text><text x="1392" y="310">aprovação e integrar</text><path class="arrow" d="M210 295H215"/><path class="arrow" d="M425 295H455"/><path class="arrow" d="M655 295H665"/><path class="arrow" d="M875 295H910"/><path class="arrow" d="M1110 295H1115"/><path class="arrow" d="M1295 295H1370"/><rect class="tag" x="426" y="218" width="42" height="23"/><text class="label" x="433" y="235">Sim</text><rect class="tag" x="876" y="218" width="42" height="23"/><text class="label" x="883" y="235">Sim</text><rect class="box" x="1365" y="470" width="195" height="70" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="1390" y="498">Conferir resultado</text><text x="1415" y="520">em main e concluir</text><path class="arrow" d="M1465 330V470"/><rect class="box" x="665" y="470" width="215" height="70" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="702" y="498">Corrigir ou registrar</text><text x="730" y="520">impedimento</text><path class="arrow" d="M770 345V470"/><path class="arrow" d="M665 505H555V330"/><text class="label" x="785" y="400">Não</text><path class="arrow" d="M1205 345V410H555V330"/><text class="label" x="1020" y="400">Sim: ajustar e verificar novamente</text><rect class="box" x="190" y="470" width="180" height="70" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="220" y="498">Refinar ou registrar</text><text x="244" y="520">impedimento</text><path class="arrow" d="M320 345V470"/><path class="arrow" d="M190 505H120V330"/><text class="label" x="330" y="400">Não</text><text class="label" x="1305" y="282">Não</text><text x="42" y="620" font-size="13">Resumo do fluxo. A proteção da main e os checks obrigatórios ainda precisam ser configurados e conferidos.</text></svg>
