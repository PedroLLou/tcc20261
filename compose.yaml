services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcc}
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: localhost/tcc20261-migrate:local
    build:
      context: ./backend
      dockerfile: Containerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      # Conexão usada pelo Prisma Migrate (dono do banco). Com o banco local
      # do Compose, é igual à DATABASE_URL. Ver docs/banco-de-dados.md.
      DIRECT_URL: ${DIRECT_URL:?Defina DIRECT_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: localhost/tcc20261-api:local
    build:
      context: ./backend
      dockerfile: Containerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      DEFAULT_ADMIN_RH_EMAIL: ${DEFAULT_ADMIN_RH_EMAIL:?Defina DEFAULT_ADMIN_RH_EMAIL}
      DEFAULT_ADMIN_RH_PASSWORD: ${DEFAULT_ADMIN_RH_PASSWORD:?Defina DEFAULT_ADMIN_RH_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tcc20261-api}
      APP_RELEASE: ${APP_RELEASE:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/v1/health/ready', {signal: AbortSignal.timeout(2500)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  frontend:
    image: localhost/tcc20261-frontend:local
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres_data:
